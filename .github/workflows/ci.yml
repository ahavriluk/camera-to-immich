name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Verify go modules
        run: |
          go mod download
          go mod verify

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Build camera-to-immich
        run: go build -v ./cmd/camera-to-immich

      - name: Build chroma-denoise
        run: go build -v ./cmd/chroma-denoise

      - name: Build chroma-measure
        run: go build -v ./cmd/chroma-measure